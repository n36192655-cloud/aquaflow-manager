name: Temporary lint fix

on:
  push:
    branches:
      - feat/mizan-field-readiness-2026-09-11

permissions:
  contents: write

concurrency:
  group: temporary-lint-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Format Supabase functions
        run: bunx prettier --write "supabase/functions/**/*.{ts,tsx}"
      - name: Fix lint
        run: bunx eslint "src/integrations/supabase/previewAuthStorage.ts" --fix
      - name: Commit fixes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/integrations/supabase/previewAuthStorage.ts supabase/functions
          git commit -m "chore: apply lint and formatting fixes"
          git push
